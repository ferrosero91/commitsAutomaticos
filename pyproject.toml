[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocommit"
version = "2.2.4"
description = "Crea historiales de commits reproducibles repartiendo archivos entre colaboradores."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fernando Rosero" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
autocommit = "autocommit.cli:main"
autocommit-gui = "autocommit.gui:main"

[tool.setuptools.packages.find]
include = ["autocommit*"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
